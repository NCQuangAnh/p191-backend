spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemetry}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Production: nên đổi sang 'validate' và quản lý schema bằng Flyway/Liquibase.
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
