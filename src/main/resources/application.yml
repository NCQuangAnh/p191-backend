spring:
  application:
    name: p191-telemetry
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetry}
    username: ${SPRING_DATASOURCE_USERNAME:p191}
    password: ${SPRING_DATASOURCE_PASSWORD:p191pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:ZGV2LWxvY2FsLXNlY3JldC1kby1ub3QtdXNlLTEyMzQ1Njc4}
      ttl-seconds: 3600
    # Khóa app khách gửi kèm header X-Api-Key khi ghi heartbeat/event.
    device-api-key: "dev-device-key-doi-o-production"
  admin:
    username: "admin"
    password: "admin123"   # ĐỔI ngay ở production
  device:
    # lastSeen còn trong ngưỡng này (giây) thì coi là online.
    online-threshold-seconds: 120
  google:
    # Key Google Places (New) + Cloud TTS - trước đây bundle thẳng trong APK
    # (lib/config/secrets.dart phía Flutter), đổi sang giữ ở backend + gọi
    # qua proxy (xem metrics.ProxyController) để không lộ key khi decompile
    # app. Set qua biến môi trường GOOGLE_PLACES_API_KEY/GOOGLE_TTS_API_KEY
    # trên Render, KHÔNG hardcode giá trị thật ở đây.
    places-api-key: ${GOOGLE_PLACES_API_KEY:}
    tts-api-key: ${GOOGLE_TTS_API_KEY:}

logging:
  level:
    root: INFO
