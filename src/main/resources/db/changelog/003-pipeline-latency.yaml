databaseChangeLog:
  - changeSet:
      id: 003-pipeline-latency
      author: claude
      changes:
        - createTable:
            tableName: pipeline_latency_events
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: device_id
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: driver_id
                  type: varchar(64)
              - column:
                  name: app_version
                  type: varchar(32)
              - column:
                  name: stt_ms
                  type: integer
              - column:
                  name: classify_ms
                  type: integer
              - column:
                  name: summarize_ms
                  type: integer
              - column:
                  name: tts_ms
                  type: integer
              - column:
                  name: received_at
                  type: timestamp(6) with time zone
                  constraints:
                    nullable: false
        - createIndex:
            indexName: ix_pipeline_latency_received
            tableName: pipeline_latency_events
            columns:
              - column:
                  name: received_at
