services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: p191
      POSTGRES_PASSWORD: p191pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p191 -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/telemetry
      SPRING_DATASOURCE_USERNAME: p191
      SPRING_DATASOURCE_PASSWORD: p191pass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: